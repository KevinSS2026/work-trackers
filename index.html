<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e293b'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='white'>⏱</text></svg>">
    <title>Учёт рабочего времени</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f1f5f9; color: #0f172a; padding: 16px; max-width: 500px; margin: 0 auto; }
        .card { background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 16px; }
        h1 { font-size: 20px; text-align: center; margin-bottom: 16px; color: #1e293b; }
        .status-box { text-align: center; padding: 16px; background: #f8fafc; border-radius: 12px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .status-label { font-size: 14px; color: #64748b; margin-bottom: 4px; }
        .status-value { font-size: 18px; font-weight: 700; color: #0f172a; }
        .active-dot { display: inline-block; width: 10px; height: 10px; background-color: #22c55e; border-radius: 50%; margin-right: 6px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button { border: none; border-radius: 12px; padding: 16px; font-size: 18px; font-weight: 700; cursor: pointer; transition: opacity 0.2s, transform 0.1s; }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-start { background-color: #16a34a; color: white; }
        .btn-stop { background-color: #dc2626; color: white; }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .history-title { font-size: 16px; font-weight: 700; }
        .btn-clear { background: none; color: #ef4444; font-size: 13px; padding: 4px 8px; font-weight: 600; }
        .record { border-bottom: 1px solid #e2e8f0; padding: 12px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .record:last-child { border-bottom: none; }
        .record-info { flex: 1; }
        .record-duration { font-size: 18px; font-weight: 700; color: #2563eb; margin-bottom: 4px; }
        .record-times { font-size: 13px; color: #475569; line-height: 1.4; }
        .record-actions { display: flex; flex-direction: column; gap: 6px; }
        .btn-small { padding: 8px 12px; font-size: 13px; border-radius: 8px; font-weight: 600; }
        .btn-edit { background-color: #e2e8f0; color: #1e293b; }
        .btn-delete { background-color: #fee22e; color: #dc2626; }
        .empty-text { text-align: center; color: #94a3b8; font-size: 14px; padding: 20px 0; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.6); align-items: center; justify-content: center; padding: 16px; z-index: 1000; }
        .modal-overlay.open { display: flex; }
        .modal { background: #ffffff; border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); }
        .modal h2 { font-size: 18px; margin-bottom: 16px; color: #1e293b; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; color: #475569; margin-bottom: 6px; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; color: #0f172a; background: #f8fafc; }
        .modal-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-cancel { background-color: #e2e8f0; color: #334155; font-size: 15px; padding: 12px; }
        .btn-save { background-color: #2563eb; color: white; font-size: 15px; padding: 12px; }
.btn-norms { background-color: #3b82f6; color: white; width: 100%; margin-top: 12px; }
.norms-modal { max-width: 95vw; width: 900px; }
.search-input { width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; }
.table-wrap { max-height: 60vh; overflow: auto; border: 1px solid #cbd5e1; border-radius: 10px; position: relative; }
.norms-table { width: max-content; border-collapse: collapse; font-size: 13px; text-align: center; }
.norms-table th, .norms-table td { padding: 8px 10px; border: 1px solid #e2e8f0; background: #fff; }
.norms-table thead th { background-color: #f1f5f9; font-weight: 700; position: sticky; top: 0; z-index: 2; color: #0f172a; }
.norms-table th:first-child, .norms-table td:first-child { position: sticky; left: 0; z-index: 1; text-align: left; font-weight: 600; background-color: #f8fafc; min-width: 170px; max-width: 210px; border-right: 2px solid #cbd5e1; }
.norms-table thead th:first-child { z-index: 3; }
.norms-table tr.section-row td { background-color: #e0f2fe; font-weight: 700; text-align: left; color: #0369a1; }
.norms-table td.total-col { font-weight: 700; background-color: #fefce8; }
    </style>
</head>

const TOTAL_COLS =;[0][1]

function renderNormsTable(filter = '') {
  const container = document.getElementById('normsTableContainer');
  const q = filter.toLowerCase().trim();
  let html = '<table class="norms-table"><thead>' +
    '<tr>' +
      '<th rowspan="2">Станция, парк, примечание</th>' +
      '<th rowspan="2">Серии локомотивов</th>' +
      '<th rowspan="2">От явки до приёмки, мин</th>' +
      '<th colspan="3">Приёмка с поездом</th>' +
      '<th colspan="3">Приёмка резервом</th>' +
      '<th colspan="5">Сдача с поездом</th>' +
      '<th colspan="5">Сдача резервом</th>' +
    '</tr>' +
    '<tr>' +
      '<th>до КП, мин</th><th>от КП до отпр., мин</th><th>Итого от явки</th>' +
      '<th>до КП, мин</th><th>от КП до отпр., мин</th><th>Итого от явки</th>' +
      '<th>от приб. до КП</th><th>от КП до сдачи</th><th>Итого до сдачи</th><th>до оконч. раб.</th><th>Итого от приб.</th>' +
      '<th>от приб. до КП</th><th>от КП до сдачи</th><th>Итого до сдачи</th><th>до оконч. раб.</th><th>Итого от приб.</th>' +
    '</tr></thead><tbody>';

  NORMS_DATA.forEach(row => {
    if (row[0] === 'SECTION') {
      if (!q) html += '<tr class="section-row"><td colspan="19">' + row[1] + '</td></tr>';
      return;
    }
    if (q && !row[0].toLowerCase().includes(q) && !row[1].toLowerCase().includes(q)) return;
    html += '<tr>';
    row.forEach((cell, idx) => {
      const cls = TOTAL_COLS.includes(idx) && cell ? ' class="total-col"' : '';
      html += '<td' + cls + '>' + (cell || '—') + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

function openNormsModal() {
  document.getElementById('normsSearch').value = '';
  renderNormsTable();
  document.getElementById('normsModal').classList.add('open');
}

function filterNorms() {
  renderNormsTable(document.getElementById('normsSearch').value);
}

function closeNormsModal() {
  document.getElementById('normsModal').classList.remove('open');
}

        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const statusLabel = document.getElementById('statusLabel');
        const statusValue = document.getElementById('statusValue');
        const historyList = document.getElementById('historyList');
        const editModal = document.getElementById('editModal');
        function formatDateTime(timestamp) {
            const d = new Date(timestamp);
            return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' в ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }
        function toLocalInputString(timestamp) {
            const d = new Date(timestamp);
            const offset = d.getTimezoneOffset() * 60000;
            return new Date(d.getTime() - offset).toISOString().slice(0, 16);
        }
        function formatDuration(ms) {
            if (ms < 0) return '0 ч 0 мин';
            const totalMinutes = Math.floor(ms / 60000);
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            return `${hours} ч ${minutes} мин`;
        }
        function getHistory() {
            try {
                const data = JSON.parse(localStorage.getItem('workHistory') || '[]');
                return Array.isArray(data) ? data : [];
            } catch (e) { return []; }
        }
        function updateUI() {
            const activeStart = localStorage.getItem('activeWorkStart');
            if (activeStart) {
                btnStart.disabled = true;
                btnStop.disabled = false;
                statusLabel.innerHTML = '<span class="active-dot"></span>Смена идёт';
                statusValue.textContent = 'Начало: ' + formatDateTime(Number(activeStart));
            } else {
                btnStart.disabled = false;
                btnStop.disabled = true;
                statusLabel.textContent = 'Смена не начата';
                statusValue.textContent = 'Нажмите «Старт»';
            }
            renderHistory();
        }
        function startWork() {
            localStorage.setItem('activeWorkStart', Date.now());
            updateUI();
        }
        function stopWork() {
            const startStr = localStorage.getItem('activeWorkStart');
            if (!startStr) return;
            const start = Number(startStr);
            const end = Date.now();
            const history = getHistory();
            history.unshift({start: start, end: end, duration: formatDuration(end - start)});
            localStorage.setItem('workHistory', JSON.stringify(history));
            localStorage.removeItem('activeWorkStart');
            updateUI();
        }
        function renderHistory() {
    const history = getHistory();
    const summaryBox = document.getElementById('monthlySummary');
    const totals = {};
    history.forEach(item => {
        const d = new Date(item.start);
        const key = d.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
        totals[key] = (totals[key] || 0) + (item.end - item.start);
    });    const keys = Object.keys(totals);
    if (keys.length === 0) {
        summaryBox.style.display = 'none';
    } else {
        summaryBox.style.display = 'block';
        summaryBox.textContent = 'Итого: ' + keys.map(k => k + ' — ' + formatDuration(totals[k])).join(' | ');
    }
    if (history.length === 0) {
        historyList.textContent = 'Записей пока нет';
        return;
    }
    historyList.textContent = '';
    history.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'record';
                const info = document.createElement('div');
        info.className = 'record-info';
        const dur = document.createElement('div');
        dur.className = 'record-duration';
        dur.textContent = 'Отработано: ' + item.duration;
        const times = document.createElement('div');
        times.className = 'record-times';
        times.textContent = 'Старт: ' + formatDateTime(item.start) + ' | Стоп: ' + formatDateTime(item.end);
        info.append(dur, times);

        const acts = document.createElement('div');
        acts.className = 'record-actions';
        const bEdit = document.createElement('button');
        bEdit.className = 'btn-small btn-edit';
        bEdit.textContent = 'Изменить';
        bEdit.onclick = () => openEditModal(index);
        const bDel = document.createElement('button');
        bDel.className = 'btn-small btn-delete';
        bDel.textContent = 'Удалить';
        bDel.onclick = () => deleteRecord(index);
        acts.append(bEdit, bDel);
        row.append(info, acts);

        historyList.append(row);
    });
}


        function openEditModal(index) {
            const history = getHistory();
            const record = history[index];
            if (!record) return;
            document.getElementById('editIndex').value = index;
            document.getElementById('editStart').value = toLocalInputString(record.start);
            document.getElementById('editEnd').value = toLocalInputString(record.end);
            editModal.classList.add('open');
        }
        function closeEditModal() { editModal.classList.remove('open'); }
        function saveEdit() {
            const index = Number(document.getElementById('editIndex').value);
            const startVal = document.getElementById('editStart').value;
            const endVal = document.getElementById('editEnd').value;
            if (!startVal || !endVal) { alert('Заполните оба поля'); return; }
            const newStart = new Date(startVal).getTime();
            const newEnd = new Date(endVal).getTime();
            if (newEnd < newStart) { alert('Конец не может быть раньше начала'); return; }
            const history = getHistory();
            history[index] = {start: newStart, end: newEnd, duration: formatDuration(newEnd - newStart)};
            localStorage.setItem('workHistory', JSON.stringify(history));
            closeEditModal();
            updateUI();
        }
        function deleteRecord(index) {
            if (confirm('Удалить эту смену>')) {
                const history = getHistory();
                history.splice(index, 1);
                localStorage.setItem('workHistory', JSON.stringify(history));
                updateUI();
            }
        }
        function clearHistory() {
            if (confirm('Удалить всю историю смен?')) {
                localStorage.removeItem('workHistory');
                updateUI();
            }
        }
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
        }
        updateUI();
    </script>
</body>
</html>
